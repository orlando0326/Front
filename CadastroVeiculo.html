</head>
<body>


    <header class="sidebar">

        <nav class="nav-menu">

            <img src="img/Mascote%20Mec%C3%A2nicas%20Car%20em%20Verde.png" alt="Logo Mecânicas Car" class="img-logo" >

            <ul class="lista-menu">

                <li>
                    <a href="menu.html">Inicial</a>
                </li>

                <li>
                    <a href="Agendamentos.html">Agendamentos</a>
                </li>

                <li>
                    <a href="ListagemCliente.html">listagem de Clientes</a>
                </li>

                <li>
                    <a href="CadastroAgendamento.html">
                        Cadastro de Agendamento
                    </a>
                </li>

                <li>
                    <a href="CadastroVeiculo.html">
                        Cadastro de Veículo
                    </a>
                </li>

                <li>
                    <a href="CadastroCliente.html">
                        Cadastro de Clientes
                    </a>
                </li>

            </ul>

        </nav>

        <div class="perfil">

            <div class="perfil-info">

                <img src="img/8582317-2158265342-latest.png"
                    alt="Perfil" class="perfil-avatar2">

                <div class="perfil-dados">

                    <span class="perfil-nome">
                        LukinhasKabuto
                    </span>

                    <span class="perfil-cargo">
                        Administrador
                    </span>

                </div>

            </div>

            <a href="index.html" class="btn-sair">
                Sair
            </a>

        </div>

    </header>


    <main class="conteudo">

        <h1 class="titulo-cadastro">Cadastro de Veiculo</h1>

        <form>

            <section class="card">

                 <label for="Placa">Placa</label> 
                 <input type="text" id="Placa" name="Placa" placeholder="Digite a Placa do carro ou moto (Exem: LLF9R22)" required>

            </section>

            <section class="card"> 

                <label for="marca">marca</label> 
                <input type="text" id="marca" name="marca" placeholder="Digite o nome da marca de carro" required> 

            </section>

            <section class="card"> 

                <label for="Modelo">Modelo</label> 
                <input type="text" id="Modelo" name="Modelo" placeholder="Digite modelo de seu carro" required>

            </section>

            <section class="card">

                 <label for="Cor">Cor</label> 
                 <input type="text" id="Cor" name="Cor" placeholder="Digite a Cor do sue carro" required> 

            </section>

            <section class="btn-cadastro">

                 <button type="submit" class="btn-cadastrar"><a href="menu.html">Cadastrar</a></button> 

            </section>

        </form>

    </main>

</body>

</html>
